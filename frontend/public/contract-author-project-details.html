<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project details — PactFlow</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/contract-authoring.css"></head><body class="authoring-page" data-authoring-step="2"><main class="authoring-main"><header class="authoring-top"><a class="brand" href="/contracts">Pact<span>Flow</span></a><a href="/contracts">Save and exit</a></header><ol class="authoring-steps" aria-label="Contract draft steps"><li class="authoring-step done"><b>✓</b><span>Choose person</span></li><i class="authoring-line"></i><li class="authoring-step current"><b>2</b><span>Project details</span></li><i class="authoring-line"></i><li class="authoring-step"><b>3</b><span>Review terms</span></li><i class="authoring-line"></i><li class="authoring-step"><b>4</b><span>Send</span></li></ol><h1 class="authoring-title">Describe the project</h1><p class="authoring-intro">We’ll turn these details into editable milestones and draft terms.</p><form class="authoring-form" data-authoring-form><label>Your responsibility<select name="initiatorResponsibility" required><option value="">Choose your role</option><option value="buyer">I’m hiring a service provider</option><option value="service_provider">I’m providing a service</option></select></label><label>Contract name<input name="name" required maxlength="160" placeholder="e.g. E-commerce platform redesign"></label><label>Scope<textarea name="scope" required rows="4" maxlength="4000" placeholder="Describe the deliverables, goals, and important requirements."></textarea></label><label>Plain-language outcome<textarea name="outcome" required rows="2" placeholder="What should be true when this work is complete?"></textarea></label><label>Included deliverables <textarea name="includedDeliverables" required rows="3" placeholder="One deliverable per line"></textarea></label><label>Proposed total allocation (testnet eUSD)<input name="totalAllocation" type="number" min="2" required></label><label>Project start<input name="projectStartDateUtc" type="datetime-local" required></label><label>Buyer funding deadline<input name="fundingDeadlineUtc" type="datetime-local" required></label><label>Change-request process<textarea name="proposalProcess" required rows="2">Either Contract Party may propose a written change request.</textarea></label><div class="authoring-actions"><a href="/contracts/new/choose-person">Back</a><button class="primary" type="submit">Generate terms</button></div></form></main><script type="module" src="/contract-authoring.bundle.js"></script></body></html>
