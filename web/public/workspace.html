<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="PactFlow contract workspace." />
    <title>Contract workspace — PactFlow</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/responsive.css" />

  <body class="workspace-page">
    <a class="skip-link" href="#workspace-main">Skip to Contract content</a>
